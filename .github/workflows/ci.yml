name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Python compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python sources
        run: python -m compileall -q .

  lint:
    name: Lint (real errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --upgrade ruff
      - name: Ruff (undefined/redefined/unused vars)
        run: ruff check --select F821,F811,F841 .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      BOT_TOKEN: "1:abc"
      STT_MODE: "groq"
      USAGE_DB_PATH: "/tmp/usage.db"
      USER_PREFS_PATH: "/tmp/user_prefs.json"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run pytest
        run: pytest -q --cov=. --cov-report=term-missing --cov-fail-under=0

  type-check:
    name: Type check (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy
        run: pip install mypy
      - name: Run mypy
        run: mypy bot.py stt.py config.py --ignore-missing-imports

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: pip install bandit pip-audit
      - name: Bandit
        run: bandit -r bot.py stt.py config.py checker.py summary.py tone.py prefs.py -s B110,B104
      - name: pip-audit
        run: pip-audit -r requirements.txt

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error start.sh stop.sh backup.sh

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t audio-decoder-bot:ci .

  all-green:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [compile, lint, tests, security, shellcheck, docker]
    steps:
      - run: echo "✅ CI passed"