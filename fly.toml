# fly.toml app configuration file generated for audio-decoder-bot-matveii on 2026-10-22T17:34:00+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'audio-decoder-bot-matveii'
primary_region = 'fra'

[build]

[env]
  USER_PREFS_PATH = "/app/data/user_prefs.json"
  USAGE_DB_PATH = "/app/data/usage.db"
  MEDIA_DIR = "/app/data/media"
  STT_MODE = "groq"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[processes]
  app = "python run.py"

[[mounts]]
  source = "audio_decoder_data"
  destination = "/app/data"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
