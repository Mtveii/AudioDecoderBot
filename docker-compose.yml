services:
  bot:
    build: .
    image: ai-dehif_bot:latest
    container_name: ai-dehif_bot
    restart: unless-stopped
    env_file:
      - .env
    # no ports needed, polling only
    volumes:
      # персист per-user настроек, админ-аналитики и самих аудио — переживает пересборку, чистишь сам
      - ./user_prefs.json:/app/user_prefs.json
      - ./usage.db:/app/usage.db
      - ./media:/app/media
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'run.py|bot.py' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
