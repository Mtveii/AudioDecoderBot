services:
  bot:
    build: .
    image: ai-dehif_bot:latest
    container_name: ai-dehif_bot
    restart: unless-stopped
    env_file:
      - .env
    # no ports needed, polling only
    volumes:
      # персист per-user настроек — переживает пересборку (прод готовность)
      - ./user_prefs.json:/app/user_prefs.json
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; exit(0 if pathlib.Path('bot.py').exists() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
